<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roost</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235865f2' d='M4 13 16 3l12 10-2 2-1-.8V28h-6v-7h-6v7H7V14.2L6 15z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="auth-view" hidden>
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><path fill="#5865f2" d="M4 13 16 3l12 10-2 2-1-.8V28h-6v-7h-6v7H7V14.2L6 15z"/></svg>
    </div>
    <h1>Roost</h1>
    <p class="auth-sub">Your place to perch.</p>
    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab active" type="button">Log in</button>
      <button id="tab-register" class="auth-tab" type="button">Create account</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label class="field">
        <span>Username</span>
        <input id="auth-username" name="username" maxlength="24" required autocomplete="username">
      </label>
      <label class="field">
        <span>Password</span>
        <input id="auth-password" name="password" type="password" minlength="8" required autocomplete="current-password">
      </label>
      <label class="field" id="invite-field" hidden>
        <span>Invite code</span>
        <input id="auth-invite" name="invite" autocomplete="off" placeholder="from the admin">
      </label>
      <p id="auth-error" class="auth-error" hidden></p>
      <button type="submit" id="auth-submit" class="btn primary wide">Log in</button>
    </form>
  </div>
</section>

<section id="chat-view" hidden>
  <nav class="rail">
    <div class="rail-logo" title="Roost">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path fill="#fff" d="M4 13 16 3l12 10-2 2-1-.8V28h-6v-7h-6v7H7V14.2L6 15z"/></svg>
    </div>
  </nav>

  <aside class="channels">
    <header class="channels-head">
      <span class="server-name">Roost</span>
      <button id="admin-btn" class="icon-btn" hidden aria-label="Server settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2.03-3.52c-.12-.22-.37-.31-.59-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.24 0-.44.17-.47.41l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.47 0-.59.22L2.36 8.73c-.12.22-.07.49.12.64L4.59 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.24.42-.12.64l2.03 3.52c.12.22.37.31.59.22l2.49-1c.52.4 1.06.73 1.69.98l.37 2.65c.03.24.23.41.47.41h4c.24 0 .44-.17.47-.41l.37-2.65c.63-.26 1.17-.59 1.69-.98l2.49 1c.22.09.47 0 .59-.22l2.03-3.52c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/></svg>
      </button>
    </header>
    <ul id="channel-list" class="channel-list"></ul>
    <div class="me-card">
      <span class="me-avatar" id="me-avatar"></span>
      <span class="me-name" id="me-name"></span>
      <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16.56 5.44 15.11 6.89A6 6 0 0 1 18 12a6 6 0 0 1-2.89 5.11l1.45 1.45A8 8 0 0 0 20 12a8 8 0 0 0-3.44-6.56M12 4l-8 4v12l8-4V4Z"/></svg>
      </button>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <span class="hash">#</span>
      <span id="chat-title" class="chat-title">general</span>
      <span id="conn-dot" class="conn-dot conn-dot--on" title="Connected"></span>
      <span id="online-count" class="online-count"></span>
    </header>
    <div id="messages" class="messages" tabindex="0"></div>
    <button id="jump-btn" class="jump-btn" hidden>Jump to present</button>
    <div id="typing-bar" class="typing-bar" hidden></div>
    <form id="composer" class="composer">
      <textarea id="composer-input" rows="1" placeholder="Message Roost" maxlength="4000"></textarea>
      <button type="submit" class="send-btn icon-btn" aria-label="Send message" title="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </main>

  <aside class="members">
    <h2 class="members-title">Members</h2>
    <ul id="member-list" class="member-list"></ul>
  </aside>
</section>

<div id="admin-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Server settings">
    <header class="modal-head">
      <h2>Server settings</h2>
      <button id="admin-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="m19 6.41-1.41-1.41L12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </header>
    <div class="modal-body">
      <section class="modal-section">
        <h3>Channels</h3>
        <ul id="admin-channels" class="admin-list"></ul>
        <form id="admin-channel-form" class="inline-form">
          <input id="admin-channel-name" placeholder="new-channel" pattern="[a-z0-9\-]{2,32}" required>
          <button type="submit" class="btn">Create channel</button>
        </form>
      </section>
      <section class="modal-section">
        <h3>Invites</h3>
        <form id="admin-invite-form" class="inline-form">
          <select id="admin-invite-uses">
            <option value="1">1 use</option>
            <option value="5">5 uses</option>
            <option value="10">10 uses</option>
            <option value="0">Unlimited</option>
          </select>
          <button type="submit" class="btn primary">Create invite</button>
        </form>
        <div id="invite-result" class="invite-result" hidden>
          <code id="invite-result-code"></code>
          <button id="invite-copy" class="btn">Copy</button>
        </div>
        <ul id="admin-invites" class="admin-list"></ul>
      </section>
      <section class="modal-section">
        <h3>Members</h3>
        <ul id="admin-members" class="admin-list"></ul>
      </section>
    </div>
  </div>
</div>

<script src="/app.js" defer></script>
</body>
</html>
